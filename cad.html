<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini CAD — 最小限の2D CAD</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1e1e24;
    --panel: #26262e;
    --panel-2: #2f2f39;
    --line: #3a3a46;
    --text: #e6e6ec;
    --muted: #9a9aa8;
    --accent: #4aa3ff;
    --accent-2: #2b7fd6;
  }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  .group { display: flex; gap: 4px; align-items: center; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  button, .btn {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .12s, border-color .12s;
  }
  button:hover, .btn:hover { background: #383844; }
  button.active {
    background: var(--accent-2);
    border-color: var(--accent);
    color: #fff;
  }
  button:disabled { opacity: .4; cursor: default; }
  .tool-label { font-size: 12px; }
  main { flex: 1; position: relative; }
  #canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #canvas.pan { cursor: grabbing; }
  #canvas.select { cursor: default; }
  footer {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 5px 14px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  footer b { color: var(--text); font-weight: 600; }
  .hint {
    position: absolute;
    left: 12px;
    bottom: 12px;
    background: rgba(0,0,0,.55);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 260px;
    pointer-events: none;
  }
  .hint kbd {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--text);
    font-size: 10.5px;
  }
  label.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Mini <span>CAD</span></h1>
  <div class="sep"></div>
  <div class="group" id="tools">
    <button data-tool="select" title="選択・移動 (V)">▲ 選択</button>
    <button data-tool="line" class="active" title="直線 (L)">╱ 直線</button>
    <button data-tool="rect" title="長方形 (R)">▭ 長方形</button>
    <button data-tool="circle" title="円 (C)">◯ 円</button>
    <button data-tool="poly" title="連続線 (P)">⟋ 連続線</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="undo" title="元に戻す (Ctrl+Z)">↶ 戻す</button>
    <button id="redo" title="やり直し (Ctrl+Y)">↷ 進む</button>
    <button id="delete" title="削除 (Delete)">🗑 削除</button>
  </div>
  <div class="spacer"></div>
  <div class="group">
    <label class="chk"><input type="checkbox" id="snap" checked> スナップ</label>
    <div class="sep"></div>
    <button id="save" title="JSONで保存">💾 保存</button>
    <label class="btn" title="JSONを読込">📂 開く<input type="file" id="load" accept=".json,application/json"></label>
    <button id="svg" title="SVGで書き出し">⬇ SVG</button>
    <button id="clear" title="全消去">✕ 全消去</button>
  </div>
</header>

<main>
  <canvas id="canvas"></canvas>
  <div class="hint">
    <div><kbd>ホイール</kbd> ズーム / <kbd>右・中ドラッグ</kbd> 移動</div>
    <div><kbd>Space</kbd>+ドラッグでも移動 / <kbd>Esc</kbd> キャンセル</div>
    <div>連続線は <kbd>ダブルクリック</kbd> か <kbd>Enter</kbd> で確定</div>
  </div>
</main>

<footer>
  <span>ツール: <b id="f-tool">直線</b></span>
  <span>座標: <b id="f-pos">0, 0</b></span>
  <span>長さ: <b id="f-len">—</b></span>
  <span>倍率: <b id="f-zoom">100%</b></span>
  <span>図形数: <b id="f-count">0</b></span>
</footer>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // ---- ワールド状態 ----
  const state = {
    shapes: [],          // { id, type, ...geom }
    tool: "line",
    snap: true,
    grid: 20,            // ワールド単位のグリッド間隔
    view: { x: 0, y: 0, scale: 1 }, // スクリーン = ワールド*scale + view
    selection: new Set(),
    undo: [],
    redo: [],
  };
  let uid = 1;

  // 進行中の作図
  let draft = null;      // { type, ... } 描画途中の図形
  let polyPts = null;    // 連続線の確定済み頂点
  // ドラッグ操作
  let drag = null;       // { mode:'pan'|'move'|'draw'|'marquee', ... }
  let spaceDown = false;
  let mouse = { sx: 0, sy: 0, wx: 0, wy: 0 };

  // ---- 座標変換 ----
  function toScreen(wx, wy) {
    return { x: wx * state.view.scale + state.view.x, y: wy * state.view.scale + state.view.y };
  }
  function toWorld(sx, sy) {
    return { x: (sx - state.view.x) / state.view.scale, y: (sy - state.view.y) / state.view.scale };
  }
  function snap(v) {
    if (!state.snap) return v;
    return Math.round(v / state.grid) * state.grid;
  }
  function snapPt(p) { return { x: snap(p.x), y: snap(p.y) }; }

  // ---- 履歴 ----
  function snapshot() {
    return JSON.stringify(state.shapes);
  }
  function pushUndo() {
    state.undo.push(snapshot());
    if (state.undo.length > 100) state.undo.shift();
    state.redo.length = 0;
    updateUI();
  }
  function restore(json) {
    state.shapes = JSON.parse(json);
    state.selection.clear();
  }
  function undo() {
    if (!state.undo.length) return;
    state.redo.push(snapshot());
    restore(state.undo.pop());
    draft = null; polyPts = null;
    render(); updateUI();
  }
  function redo() {
    if (!state.redo.length) return;
    state.undo.push(snapshot());
    restore(state.redo.pop());
    draft = null; polyPts = null;
    render(); updateUI();
  }

  // ---- 図形操作 ----
  function addShape(s) {
    pushUndo();
    s.id = uid++;
    state.shapes.push(s);
    render(); updateUI();
  }
  function bbox(s) {
    if (s.type === "line") {
      return { x1: Math.min(s.x1, s.x2), y1: Math.min(s.y1, s.y2), x2: Math.max(s.x1, s.x2), y2: Math.max(s.y1, s.y2) };
    }
    if (s.type === "rect") {
      return { x1: Math.min(s.x1, s.x2), y1: Math.min(s.y1, s.y2), x2: Math.max(s.x1, s.x2), y2: Math.max(s.y1, s.y2) };
    }
    if (s.type === "circle") {
      return { x1: s.cx - s.r, y1: s.cy - s.r, x2: s.cx + s.r, y2: s.cy + s.r };
    }
    if (s.type === "poly") {
      const xs = s.pts.map(p => p.x), ys = s.pts.map(p => p.y);
      return { x1: Math.min(...xs), y1: Math.min(...ys), x2: Math.max(...xs), y2: Math.max(...ys) };
    }
  }
  function translate(s, dx, dy) {
    if (s.type === "line" || s.type === "rect") { s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy; }
    else if (s.type === "circle") { s.cx += dx; s.cy += dy; }
    else if (s.type === "poly") { s.pts.forEach(p => { p.x += dx; p.y += dy; }); }
  }

  // 点と図形のヒットテスト（ワールド座標、tol はワールド単位）
  function hit(s, wx, wy, tol) {
    if (s.type === "line") return distToSeg(wx, wy, s.x1, s.y1, s.x2, s.y2) <= tol;
    if (s.type === "rect") {
      const b = bbox(s);
      const near = (a, b0) => Math.abs(a - b0) <= tol;
      const inX = wx >= b.x1 - tol && wx <= b.x2 + tol;
      const inY = wy >= b.y1 - tol && wy <= b.y2 + tol;
      return (inX && (near(wy, b.y1) || near(wy, b.y2))) || (inY && (near(wx, b.x1) || near(wx, b.x2)));
    }
    if (s.type === "circle") {
      const d = Math.hypot(wx - s.cx, wy - s.cy);
      return Math.abs(d - s.r) <= tol;
    }
    if (s.type === "poly") {
      for (let i = 0; i < s.pts.length - 1; i++) {
        if (distToSeg(wx, wy, s.pts[i].x, s.pts[i].y, s.pts[i + 1].x, s.pts[i + 1].y) <= tol) return true;
      }
      return false;
    }
    return false;
  }
  function distToSeg(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy;
    if (l2 === 0) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }
  function shapeAt(wx, wy) {
    const tol = 6 / state.view.scale;
    for (let i = state.shapes.length - 1; i >= 0; i--) {
      if (hit(state.shapes[i], wx, wy, tol)) return state.shapes[i];
    }
    return null;
  }

  // ---- 描画 ----
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
  }

  function drawGrid(w, h) {
    const s = state.view.scale;
    let step = state.grid * s;
    // グリッドが細かすぎ/粗すぎる場合に間引き
    let mult = 1;
    while (step * mult < 12) mult *= 2;
    const g = state.grid * mult;
    const gs = g * s;

    const w0 = toWorld(0, 0), w1 = toWorld(w, h);
    const startX = Math.floor(w0.x / g) * g;
    const startY = Math.floor(w0.y / g) * g;

    ctx.lineWidth = 1;
    ctx.strokeStyle = "#2b2b34";
    ctx.beginPath();
    for (let x = startX; x <= w1.x; x += g) {
      const sx = toScreen(x, 0).x + 0.5;
      ctx.moveTo(sx, 0); ctx.lineTo(sx, h);
    }
    for (let y = startY; y <= w1.y; y += g) {
      const sy = toScreen(0, y).y + 0.5;
      ctx.moveTo(0, sy); ctx.lineTo(w, sy);
    }
    ctx.stroke();

    // 原点の軸
    ctx.strokeStyle = "#4a4a58";
    ctx.beginPath();
    const ox = toScreen(0, 0).x + 0.5, oy = toScreen(0, 0).y + 0.5;
    ctx.moveTo(ox, 0); ctx.lineTo(ox, h);
    ctx.moveTo(0, oy); ctx.lineTo(w, oy);
    ctx.stroke();
  }

  function strokeShape(s, selected) {
    ctx.strokeStyle = selected ? "#ffcc44" : "#cfe6ff";
    ctx.lineWidth = selected ? 2 : 1.5;
    ctx.beginPath();
    if (s.type === "line") {
      const a = toScreen(s.x1, s.y1), b = toScreen(s.x2, s.y2);
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    } else if (s.type === "rect") {
      const a = toScreen(Math.min(s.x1, s.x2), Math.min(s.y1, s.y2));
      const b = toScreen(Math.max(s.x1, s.x2), Math.max(s.y1, s.y2));
      ctx.rect(a.x, a.y, b.x - a.x, b.y - a.y);
    } else if (s.type === "circle") {
      const c = toScreen(s.cx, s.cy);
      ctx.arc(c.x, c.y, s.r * state.view.scale, 0, Math.PI * 2);
    } else if (s.type === "poly") {
      s.pts.forEach((p, i) => {
        const q = toScreen(p.x, p.y);
        if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
      });
    }
    ctx.stroke();

    if (selected) {
      const b = bbox(s);
      const a = toScreen(b.x1, b.y1), c = toScreen(b.x2, b.y2);
      ctx.setLineDash([4, 3]);
      ctx.strokeStyle = "rgba(255,204,68,.5)";
      ctx.lineWidth = 1;
      ctx.strokeRect(a.x - 3, a.y - 3, c.x - a.x + 6, c.y - a.y + 6);
      ctx.setLineDash([]);
    }
  }

  function render() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    drawGrid(w, h);

    for (const s of state.shapes) strokeShape(s, state.selection.has(s.id));

    // 進行中の作図
    if (draft) {
      ctx.save();
      ctx.setLineDash([5, 4]);
      strokeShape(draft, false);
      ctx.restore();
    }
    if (polyPts && polyPts.length) {
      ctx.strokeStyle = "#8fd0ff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      polyPts.forEach((p, i) => {
        const q = toScreen(p.x, p.y);
        if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
      });
      const m = toScreen(mouse.wx, mouse.wy);
      ctx.lineTo(m.x, m.y);
      ctx.stroke();
      // 頂点マーカー
      ctx.fillStyle = "#8fd0ff";
      polyPts.forEach(p => {
        const q = toScreen(p.x, p.y);
        ctx.fillRect(q.x - 2.5, q.y - 2.5, 5, 5);
      });
    }

    // マーキー選択
    if (drag && drag.mode === "marquee") {
      const a = toScreen(drag.wx0, drag.wy0), b = toScreen(mouse.wx, mouse.wy);
      ctx.setLineDash([4, 3]);
      ctx.strokeStyle = "rgba(74,163,255,.9)";
      ctx.fillStyle = "rgba(74,163,255,.12)";
      const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y), ww = Math.abs(b.x - a.x), hh = Math.abs(b.y - a.y);
      ctx.fillRect(x, y, ww, hh);
      ctx.strokeRect(x, y, ww, hh);
      ctx.setLineDash([]);
    }
  }

  // ---- UI 更新 ----
  const toolNames = { select: "選択", line: "直線", rect: "長方形", circle: "円", poly: "連続線" };
  function updateUI() {
    document.getElementById("f-tool").textContent = toolNames[state.tool];
    document.getElementById("f-zoom").textContent = Math.round(state.view.scale * 100) + "%";
    document.getElementById("f-count").textContent = state.shapes.length;
    document.getElementById("undo").disabled = !state.undo.length;
    document.getElementById("redo").disabled = !state.redo.length;
    document.getElementById("delete").disabled = state.selection.size === 0;
    document.querySelectorAll("#tools button").forEach(b => {
      b.classList.toggle("active", b.dataset.tool === state.tool);
    });
    canvas.classList.toggle("select", state.tool === "select");
  }
  function updatePos() {
    document.getElementById("f-pos").textContent = Math.round(mouse.wx) + ", " + Math.round(mouse.wy);
    let len = "—";
    if (draft) {
      if (draft.type === "line") len = Math.round(Math.hypot(draft.x2 - draft.x1, draft.y2 - draft.y1)) + "";
      else if (draft.type === "rect") len = Math.round(Math.abs(draft.x2 - draft.x1)) + " × " + Math.round(Math.abs(draft.y2 - draft.y1));
      else if (draft.type === "circle") len = "r " + Math.round(draft.r);
    } else if (polyPts && polyPts.length) {
      const last = polyPts[polyPts.length - 1];
      len = Math.round(Math.hypot(mouse.wx - last.x, mouse.wy - last.y)) + "";
    }
    document.getElementById("f-len").textContent = len;
  }

  // ---- ツール選択 ----
  function setTool(t) {
    commitPoly();
    draft = null;
    state.tool = t;
    if (t !== "select") state.selection.clear();
    render(); updateUI();
  }
  document.getElementById("tools").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) setTool(b.dataset.tool);
  });

  // ---- マウス処理 ----
  function evtPos(e) {
    const r = canvas.getBoundingClientRect();
    return { sx: e.clientX - r.left, sy: e.clientY - r.top };
  }

  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);
    const { sx, sy } = evtPos(e);
    const w = toWorld(sx, sy);
    const sp = snapPt(w);

    // パン: 中/右ボタン、または Space+左
    if (e.button === 1 || e.button === 2 || (e.button === 0 && spaceDown)) {
      drag = { mode: "pan", sx, sy, vx: state.view.x, vy: state.view.y };
      canvas.classList.add("pan");
      return;
    }
    if (e.button !== 0) return;

    if (state.tool === "select") {
      const found = shapeAt(w.x, w.y);
      if (found) {
        if (!e.shiftKey && !state.selection.has(found.id)) state.selection.clear();
        state.selection.add(found.id);
        drag = { mode: "move", wx0: sp.x, wy0: sp.y, moved: false };
        pushUndo(); // 移動前を記録（未移動なら後で破棄）
        drag.snapJson = state.undo.pop(); // いったん退避
      } else {
        if (!e.shiftKey) state.selection.clear();
        drag = { mode: "marquee", wx0: w.x, wy0: w.y };
      }
      render(); updateUI();
      return;
    }

    // 作図ツール
    if (state.tool === "poly") {
      if (!polyPts) polyPts = [];
      polyPts.push(sp);
      render();
      return;
    }
    // line / rect / circle: ドラッグで確定
    draft = startDraft(state.tool, sp);
    drag = { mode: "draw" };
    render();
  });

  window.addEventListener("pointermove", e => {
    const { sx, sy } = evtPos(e);
    mouse.sx = sx; mouse.sy = sy;
    const w = toWorld(sx, sy);
    mouse.wx = w.x; mouse.wy = w.y;

    if (drag && drag.mode === "pan") {
      state.view.x = drag.vx + (sx - drag.sx);
      state.view.y = drag.vy + (sy - drag.sy);
      render(); updateUI();
      return;
    }

    const sp = snapPt(w);

    if (drag && drag.mode === "draw" && draft) {
      updateDraft(draft, sp);
      render(); updatePos();
      return;
    }
    if (drag && drag.mode === "move") {
      const dx = sp.x - drag.wx0, dy = sp.y - drag.wy0;
      if (dx || dy) {
        for (const id of state.selection) {
          const s = state.shapes.find(o => o.id === id);
          if (s) translate(s, dx, dy);
        }
        drag.wx0 = sp.x; drag.wy0 = sp.y; drag.moved = true;
        render();
      }
      return;
    }
    if (drag && drag.mode === "marquee") { render(); return; }

    updatePos();
    if (polyPts) render();
  });

  window.addEventListener("pointerup", e => {
    if (!drag) return;
    if (drag.mode === "pan") { canvas.classList.remove("pan"); drag = null; return; }

    if (drag.mode === "draw" && draft) {
      if (isValidDraft(draft)) addShape(draft);
      draft = null; drag = null;
      render(); updateUI();
      return;
    }
    if (drag.mode === "move") {
      if (drag.moved) { state.undo.push(drag.snapJson); state.redo.length = 0; }
      // 未移動なら退避した履歴は破棄
      drag = null; updateUI();
      return;
    }
    if (drag.mode === "marquee") {
      const x1 = Math.min(drag.wx0, mouse.wx), y1 = Math.min(drag.wy0, mouse.wy);
      const x2 = Math.max(drag.wx0, mouse.wx), y2 = Math.max(drag.wy0, mouse.wy);
      for (const s of state.shapes) {
        const b = bbox(s);
        if (b.x1 >= x1 && b.x2 <= x2 && b.y1 >= y1 && b.y2 <= y2) state.selection.add(s.id);
      }
      drag = null;
      render(); updateUI();
      return;
    }
    drag = null;
  });

  canvas.addEventListener("dblclick", () => { if (polyPts) commitPoly(); });
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  // 作図ヘルパー
  function startDraft(type, p) {
    if (type === "line") return { type: "line", x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    if (type === "rect") return { type: "rect", x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    if (type === "circle") return { type: "circle", cx: p.x, cy: p.y, r: 0 };
  }
  function updateDraft(d, p) {
    if (d.type === "line" || d.type === "rect") { d.x2 = p.x; d.y2 = p.y; }
    else if (d.type === "circle") { d.r = Math.hypot(p.x - d.cx, p.y - d.cy); }
  }
  function isValidDraft(d) {
    if (d.type === "line") return d.x1 !== d.x2 || d.y1 !== d.y2;
    if (d.type === "rect") return d.x1 !== d.x2 && d.y1 !== d.y2;
    if (d.type === "circle") return d.r > 0;
    return false;
  }
  function commitPoly() {
    if (polyPts && polyPts.length >= 2) {
      addShape({ type: "poly", pts: polyPts.map(p => ({ x: p.x, y: p.y })) });
    }
    polyPts = null;
    render();
  }

  // ---- ズーム ----
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const { sx, sy } = evtPos(e);
    const before = toWorld(sx, sy);
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    state.view.scale = Math.max(0.05, Math.min(40, state.view.scale * factor));
    const after = toWorld(sx, sy);
    state.view.x += (after.x - before.x) * state.view.scale;
    state.view.y += (after.y - before.y) * state.view.scale;
    render(); updateUI();
  }, { passive: false });

  // ---- キーボード ----
  window.addEventListener("keydown", e => {
    if (e.code === "Space") { spaceDown = true; if (!drag) canvas.classList.add("pan"); }
    const meta = e.ctrlKey || e.metaKey;
    if (meta && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (meta && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
    if (e.target.tagName === "INPUT") return;

    if (e.key === "Escape") { draft = null; polyPts = null; drag = null; render(); return; }
    if (e.key === "Enter") { if (polyPts) commitPoly(); return; }
    if (e.key === "Delete" || e.key === "Backspace") { deleteSelection(); return; }
    if (e.key === "v" || e.key === "V") setTool("select");
    if (e.key === "l" || e.key === "L") setTool("line");
    if (e.key === "r" || e.key === "R") setTool("rect");
    if (e.key === "c" || e.key === "C") setTool("circle");
    if (e.key === "p" || e.key === "P") setTool("poly");
  });
  window.addEventListener("keyup", e => {
    if (e.code === "Space") { spaceDown = false; canvas.classList.remove("pan"); }
  });

  function deleteSelection() {
    if (!state.selection.size) return;
    pushUndo();
    state.shapes = state.shapes.filter(s => !state.selection.has(s.id));
    state.selection.clear();
    render(); updateUI();
  }

  // ---- ツールバー動作 ----
  document.getElementById("undo").onclick = undo;
  document.getElementById("redo").onclick = redo;
  document.getElementById("delete").onclick = deleteSelection;
  document.getElementById("snap").onchange = e => { state.snap = e.target.checked; };
  document.getElementById("clear").onclick = () => {
    if (!state.shapes.length) return;
    if (confirm("すべての図形を消去しますか？")) {
      pushUndo();
      state.shapes = []; state.selection.clear();
      render(); updateUI();
    }
  };

  // 保存 / 読込
  document.getElementById("save").onclick = () => {
    const data = { format: "mini-cad", version: 1, grid: state.grid, shapes: state.shapes };
    downloadBlob(JSON.stringify(data, null, 2), "drawing.json", "application/json");
  };
  document.getElementById("load").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.shapes)) throw new Error("shapes がありません");
        pushUndo();
        state.shapes = data.shapes;
        uid = state.shapes.reduce((m, s) => Math.max(m, s.id || 0), 0) + 1;
        state.selection.clear();
        render(); updateUI();
      } catch (err) { alert("読込に失敗しました: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  // SVG 書き出し
  document.getElementById("svg").onclick = () => {
    if (!state.shapes.length) { alert("図形がありません"); return; }
    const pad = 20;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const s of state.shapes) {
      const b = bbox(s);
      minX = Math.min(minX, b.x1); minY = Math.min(minY, b.y1);
      maxX = Math.max(maxX, b.x2); maxY = Math.max(maxY, b.y2);
    }
    const w = maxX - minX + pad * 2, h = maxY - minY + pad * 2;
    const ox = -minX + pad, oy = -minY + pad;
    const el = [];
    for (const s of state.shapes) {
      if (s.type === "line") el.push(`<line x1="${s.x1 + ox}" y1="${s.y1 + oy}" x2="${s.x2 + ox}" y2="${s.y2 + oy}"/>`);
      else if (s.type === "rect") {
        const x = Math.min(s.x1, s.x2) + ox, y = Math.min(s.y1, s.y2) + oy;
        el.push(`<rect x="${x}" y="${y}" width="${Math.abs(s.x2 - s.x1)}" height="${Math.abs(s.y2 - s.y1)}"/>`);
      } else if (s.type === "circle") el.push(`<circle cx="${s.cx + ox}" cy="${s.cy + oy}" r="${s.r}"/>`);
      else if (s.type === "poly") el.push(`<polyline points="${s.pts.map(p => (p.x + ox) + "," + (p.y + oy)).join(" ")}"/>`);
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n` +
      `<g fill="none" stroke="#000" stroke-width="1">\n${el.join("\n")}\n</g>\n</svg>`;
    downloadBlob(svg, "drawing.svg", "image/svg+xml");
  };

  function downloadBlob(text, name, mime) {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ---- 初期化 ----
  window.addEventListener("resize", resize);
  // 中央を原点あたりに
  requestAnimationFrame(() => {
    state.view.x = canvas.clientWidth / 2;
    state.view.y = canvas.clientHeight / 2;
    resize();
    updateUI();
  });
})();
</script>
</body>
</html>
